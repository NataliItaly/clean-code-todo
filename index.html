<!doctype html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
  </head>
  <body>
    <header class="header">
      <h1 class="hidden">Todo App</h1>
      <img
        class="header__img"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix"
      /><a
        class="header__info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </header>
    <main class="main">
      <div class="add-task">
        <label for="new-task" class="add-task__label">Add Item</label>
        <div class="add-task__row">
          <input id="new-task" class="add-task__input" type="text" /><button>
            Add
          </button>
        </div>
      </div>
      <h2>Todo</h2>
      <ul id="incompleteTasks" class="todo">
        <li class="todo__item">
          <input type="checkbox" id="pay-bills" class="todo__checkbox" /><label
            class="todo__label"
            for="pay-bills"
            >Pay Bills</label
          ><input type="text" class="todo__input" id="edit-pay-bills" /><button
            class="edit-btn"
          >
            Edit</button
          ><button class="delete-btn">
            <img src="./remove.svg" alt="Remove Task" />
          </button>
        </li>
        <li class="edit-mode">
          <input
            type="checkbox"
            id="go-shopping"
            class="edit-mode__checkbox"
          /><label class="edit-mode__label" for="go-shopping">Go Shopping</label
          ><input
            type="text"
            value="Go Shopping"
            class="edit-mode__input"
          /><button class="edit-btn">Save</button
          ><button class="delete-btn">
            <img src="./remove.svg" alt="Remove Task" />
          </button>
        </li>
      </ul>
      <h2>Completed</h2>
      <ul id="completed-tasks" class="todo">
        <li class="todo__item">
          <input
            type="checkbox"
            checked
            id="see-doctor"
            class="todo__checkbox"
          /><label class="todo__label todo__label_completed" for="see-doctor"
            >See the Doctor</label
          ><input
            type="text"
            class="todo__input"
            id="edit-go-shopping"
          /><button class="edit-btn">Edit</button
          ><button class="delete-btn">
            <img src="./remove.svg" alt="Remove Task" />
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
