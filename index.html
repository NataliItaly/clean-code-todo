<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple Todo app to organize tasks, track completed items, and manage your daily to-do list."
    />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
  </head>
  <body>
    <header class="header">
      <h1 class="hidden">Todo App</h1>
      <img
        class="header__img"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix"
      /><a
        class="header__info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        aria-label="Learn more about the Eisenhower matrix"
        >Want more details&quest;</a
      >
    </header>
    <main class="main">
      <div class="add-task">
        <label for="new-task" class="add-task__label">Add Item</label>
        <div class="add-task__row">
          <input id="new-task" class="add-task__input" type="text" />
          <button type="button" id="add-new-task" aria-label="Add new task">
            Add
          </button>
        </div>
      </div>
      <h2>Todo</h2>
      <ul id="incomplete-tasks" class="todo">
        <li class="todo__item">
          <label class="hidden" for="task-1">Checkbox for task pay-bills</label>
          <input type="checkbox" id="task-1" class="todo__checkbox" /><label
            class="todo__label"
            for="1"
            >Pay Bills</label
          ><input type="text" class="todo__input" id="1" />
          <p class="todo__error">Task cannot be empty</p>
          <button
            type="button"
            class="edit-btn"
            aria-label="Edit pay bill task"
          >
            Edit</button
          ><button
            type="button"
            class="delete-btn"
            aria-label="Delete pay bill task"
          >
            <img src="./remove.svg" alt="Remove Task" />
          </button>
        </li>
        <li class="todo__item edit-mode">
          <label class="hidden" for="task-2"
            >Checkbox for task go-shopping</label
          >
          <input type="checkbox" id="task-2" class="todo__checkbox" /><label
            class="todo__label"
            for="2"
            >Go Shopping</label
          ><input type="text" value="Go Shopping" class="todo__input" id="2" />
          <p class="todo__error">Task cannot be empty</p>
          <button
            type="button"
            class="edit-btn"
            aria-label="Save go shopping task"
          >
            Save</button
          ><button
            type="button"
            class="delete-btn"
            aria-label="Delete go shopping task"
          >
            <img src="./remove.svg" alt="Remove Task" />
          </button>
        </li>
      </ul>
      <h2>Completed</h2>
      <ul id="completed-tasks" class="todo todo_completed">
        <li class="todo__item">
          <label class="hidden" for="task-3"
            >Checkbox for task see the Doctor</label
          >
          <input
            type="checkbox"
            checked
            id="task-3"
            class="todo__checkbox"
          /><label class="todo__label" for="3">See the Doctor</label
          ><input type="text" class="todo__input" id="3" />
          <p class="todo__error">Task cannot be empty</p>
          <button
            type="button"
            class="edit-btn"
            aria-label="Edit go see the doctor task"
          >
            Edit</button
          ><button
            type="button"
            class="delete-btn"
            aria-label="Delete go see the doctor task"
          >
            <img src="./remove.svg" alt="Remove Task" />
          </button>
        </li>
      </ul>
      <div
        id="task-status"
        class="hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
